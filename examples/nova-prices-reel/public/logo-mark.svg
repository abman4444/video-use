<svg xmlns="http://www.w3.org/2000/svg" viewBox="195 190 620 625" width="620" height="625" role="img" aria-label="Ahmed Makkiyah Realtor mark">
  <!--
    INTERIM REDRAW, traced by eye from the mark supplied in conversation — the artwork
    itself has never reached this machine, only the briefs and the logo sting arrived as
    files. Replace it with the real logo-mark.png and point the composition's logoSrc prop
    at it: proportions here are measured off a screen image, not the brand file.

    The mark is an A-frame roof whose counter makes the A, an M formed by two columns and
    a V, a key lying across the base, and one red block where the M meets the key.
  -->
  <g fill="#111111">
    <!-- A: chevron legs, closed along the eave line; the white it encloses is the counter -->
    <path d="M 276 508 L 503 203 L 727 508 L 659 508 L 503 313 L 344 508 Z"/>
    <!-- the A's crossbar, meeting the legs' inner edges -->
    <rect x="394" y="437" width="218" height="27"/>
    <!-- M: two columns and the V between them -->
    <rect x="344" y="508" width="62" height="284"/>
    <rect x="602" y="508" width="62" height="284"/>
    <path d="M 406 508 L 503 641 L 602 508 L 540 508 L 503 561 L 468 508 Z"/>
    <!-- key: bow, shaft, two teeth -->
    <circle cx="271" cy="740" r="36" fill="none" stroke="#111111" stroke-width="22"/>
    <rect x="307" y="729" width="485" height="21"/>
    <rect x="727" y="750" width="15" height="26"/>
    <rect x="758" y="750" width="15" height="26"/>
    <!-- ground line -->
    <rect x="208" y="789" width="592" height="11"/>
  </g>
  <!-- the single red accent, crossing the key where the M's V lands on it -->
  <rect x="477" y="698" width="49" height="94" fill="#cc1122"/>
</svg>
